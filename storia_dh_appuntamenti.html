<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rassegna appuntamenti</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
  --paper:#EFEAE1;
  --paper-alt:#F8F5EE;
  --ink:#221F1A;
  --ink-soft:#5A5546;
  --accent:#2E3A55;
  --accent-warm:#A97F2E;
  --line:#D8D0BC;
  --danger:#8B3A3A;
  --radius:4px;
  --maxw:1320px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

h1,
h2,
h3{
  font-family:'Fraunces', Georgia, serif;
  margin:0;
}

a{
  color:inherit;
}

button{
  font-family:inherit;
}

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  *{
    animation-duration:0.01ms !important;
    transition-duration:0.01ms !important;
  }
}

/* ---------- Masthead ---------- */

.masthead{
  max-width:var(--maxw);
  margin:0 auto;
  padding:56px 28px 28px;
  border-bottom:1px solid var(--line);
}

.masthead h1{
  font-size:clamp(2rem, 3.6vw, 2.9rem);
  font-weight:600;
  font-style:italic;
  letter-spacing:-0.01em;
  max-width:18ch;
}

.masthead .intro{
  margin-top:16px;
  max-width:72ch;
  font-size:1.02rem;
  color:var(--ink-soft);
}

.masthead .intro p{
  margin:0 0 10px;
}

.masthead .intro p:last-child{
  margin-bottom:0;
}

/* ---------- Toolbar ---------- */

.toolbar{
  max-width:var(--maxw);
  margin:0 auto;
  padding:20px 28px 0;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.toolbar input[type="search"]{
  flex:1 1 260px;
  max-width:420px;
  padding:9px 13px;
  border:1px solid var(--line);
  background:var(--paper-alt);
  border-radius:var(--radius);
  font-size:0.92rem;
  color:var(--ink);
}

.toolbar input[type="search"]::placeholder{
  color:var(--ink-soft);
}

.toolbar .sortgroup{
  display:flex;
  gap:6px;
  margin-left:auto;
}

.toolbar .sortgroup button{
  border:1px solid var(--line);
  background:var(--paper-alt);
  color:var(--ink-soft);
  padding:7px 13px;
  border-radius:var(--radius);
  font-size:0.85rem;
  cursor:pointer;
}

.toolbar .sortgroup button.active{
  background:var(--ink);
  color:var(--paper-alt);
  border-color:var(--ink);
}

.toolbar .count{
  font-size:0.82rem;
  color:var(--ink-soft);
  font-style:italic;
}

/* ---------- Galleria ---------- */

.gallery-wrap{
  max-width:var(--maxw);
  margin:0 auto;
  padding:28px 28px 70px;
}

.gallery{
  columns:4 260px;
  column-gap:20px;
}

.tile{
  break-inside:avoid;
  margin-bottom:20px;
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--line);
  background:var(--paper-alt);
  display:block;
  width:100%;
  padding:0;
  text-align:left;
}

.tile img{
  width:100%;
  display:block;
  transition:transform .4s ease;
}

.tile:hover img{
  transform:scale(1.04);
}

.pdf-preview-wrap{
  width:100%;
  aspect-ratio:3 / 4;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg, #DCD5C2, #CBC2A9);
  overflow:hidden;
}

.pdf-preview{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.doc-face{
  width:100%;
  aspect-ratio:3 / 4;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:linear-gradient(160deg, #DCD5C2, #CBC2A9);
  color:var(--accent);
}

.doc-face svg{
  width:34px;
  height:34px;
}

.doc-face span{
  font-size:0.75rem;
  font-style:italic;
  color:var(--ink-soft);
}

.tile .badge{
  position:absolute;
  top:10px;
  left:10px;
  background:var(--accent-warm);
  color:var(--paper-alt);
  font-size:0.68rem;
  font-weight:600;
  letter-spacing:0.02em;
  padding:3px 9px;
  border-radius:100px;
}

.tile .overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:34px 14px 12px;
  background:linear-gradient(to top, rgba(18,16,12,0.92) 0%, rgba(18,16,12,0.55) 55%, transparent 100%);
  color:#F5F1E7;
}

.tile .overlay .date{
  font-size:0.72rem;
  font-style:italic;
  opacity:0.85;
}

.tile .overlay h3{
  font-size:0.98rem;
  font-weight:600;
  color:#F8F5EE;
  margin-top:3px;
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.tile .overlay .participants{
  font-size:0.78rem;
  font-style:italic;
  opacity:0.88;
  margin-top:3px;
}

/* ---------- Stati ---------- */

.state{
  max-width:var(--maxw);
  margin:0 auto;
  padding:40px 28px 60px;
  color:var(--ink-soft);
}

.state.error{
  color:var(--danger);
}

.state .details{
  font-size:0.85rem;
  margin-top:10px;
  opacity:0.85;
}

/* ---------- Modale ---------- */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,0.74);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:100;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  background:var(--paper-alt);
  max-width:960px;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  border-radius:var(--radius);
  position:relative;
}

.modal .close{
  position:absolute;
  top:14px;
  right:14px;
  background:var(--ink);
  color:var(--paper);
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  font-size:1.1rem;
  line-height:1;
  z-index:2;
}

.modal .media{
  width:100%;
  max-height:62vh;
  background:#DAD3C1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.modal .media:empty{
  display:none;
}

.modal .media img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.modal .media iframe{
  width:100%;
  height:62vh;
  border:none;
}

.modal .media canvas{
  max-width:100%;
  height:auto;
  display:block;
}

.modal .body{
  padding:30px 34px 36px;
}

.modal .date{
  font-style:italic;
  color:var(--accent-warm);
}

.modal h3{
  font-size:1.6rem;
  font-weight:600;
  margin-top:8px;
  line-height:1.3;
}

.modal .participants{
  font-style:italic;
  color:var(--accent);
  margin-top:8px;
}

.modal .meta-list{
  margin-top:18px;
  display:grid;
  gap:8px;
  color:var(--ink-soft);
}

.modal .meta-row{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:12px;
  border-top:1px solid var(--line);
  padding-top:8px;
}

.modal .meta-label{
  font-weight:600;
  color:var(--ink);
}

.modal .actions{
  margin-top:22px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  border:1px solid var(--ink);
  padding:8px 16px;
  border-radius:var(--radius);
  font-size:0.88rem;
  text-decoration:none;
  color:var(--ink);
  background:transparent;
}

.btn:hover{
  background:var(--ink);
  color:var(--paper-alt);
}

@media (max-width:640px){
  .toolbar{
    padding:18px 20px 0;
  }

  .toolbar .sortgroup{
    margin-left:0;
  }

  .gallery-wrap{
    padding:24px 20px 60px;
  }

  .gallery{
    columns:2 160px;
    column-gap:12px;
  }

  .tile{
    margin-bottom:12px;
  }

  .modal .body{
    padding:28px 24px 32px;
  }

  .modal .meta-row{
    grid-template-columns:1fr;
    gap:2px;
  }
}

/* Il contenitore resta trasparente nell'iframe WordPress. */
html, body { background:transparent; }
body { position:relative; }
.toolbar, .gallery-wrap { max-width:none; }
.toolbar { padding-top:12px; }
.gallery-wrap { padding-top:22px; }
.gallery { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; columns:auto; }
.tile { margin-bottom:0; align-self:start; }
.tile img { aspect-ratio:3 / 4; object-fit:cover; }
.tile img + .doc-face { display:none; }
.tile .overlay .description { font-size:.78rem; line-height:1.35; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.modal .description { white-space:pre-line; margin-top:16px; color:var(--ink-soft); }
.state { padding:24px 0; }
.gallery:empty { display:none; }
.pagination { display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; margin-top:28px; }
.pagination:empty { display:none; }
.pagination button { border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-alt); color:var(--ink); padding:8px 13px; cursor:pointer; }
.pagination button.active { background:var(--ink); color:white; border-color:var(--ink); }
.pagination button:disabled { opacity:.45; cursor:default; }
.modal-backdrop { position:absolute; align-items:flex-start; }
.modal { max-height:720px; }
@media(max-width:900px){ .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px){ .gallery { grid-template-columns:minmax(0,1fr); gap:12px; } }
</style>
</head>

<body>

<div class="toolbar">
  <input
    type="search"
    id="search"
    placeholder="Cerca per titolo, descrizione, data o luogo…"
    aria-label="Cerca negli appuntamenti"
  >

  <div class="sortgroup" role="group" aria-label="Ordina">
    <button id="sortDesc" class="active" type="button">Più recenti</button>
    <button id="sortAsc" type="button">Meno recenti</button>
  </div>

  <span class="count" id="count"></span>
</div>

<main class="gallery-wrap" id="galleryStart">
  <div class="state" id="loading">Caricamento della rassegna…</div>
  <div class="gallery" id="gallery" style="display:none;"></div>
  <nav class="pagination" id="pagination" aria-label="Pagine degli appuntamenti"></nav>
</main>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <button class="close" id="modalClose" aria-label="Chiudi">&times;</button>

    <div class="media" id="modalMedia"></div>

    <div class="body">
      <div class="date" id="modalDate"></div>
      <h3 id="modalTitle"></h3>
      <div class="description" id="modalDescription"></div>

      <div class="meta-list" id="modalMeta"></div>

      <div class="actions" id="modalActions"></div>
    </div>
  </div>
</div>

<script>
'use strict';
// CSV pubblicato: gli aggiornamenti del foglio si vedono al successivo caricamento
// e, con la pagina aperta, al successivo controllo (ogni cinque minuti).
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQR78gM8NSLLBYkxMeafO0fI_NswuTMefDTYh1-jJRNi2chjuBvwTJRyFeqnxBohGpcGZg6q7Vpd60W/pub?gid=444228331&single=true&output=csv';
const FIELDS = ['titolo','descrizione','data inizio','data fine','luogo','url locandina','pdf locandina','url + info'];
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const gallery = document.getElementById('gallery');
const state = document.getElementById('loading');
const backdrop = document.getElementById('modalBackdrop');
let items = [], sortDir = 'desc', currentPage = 1, previousFocus = null, modalVersion = 0;
const PAGE_SIZE = 6;
function reportHeight() {
  // La pagina WordPress regola l'altezza dell'iframe in base al contenuto.
  const modal=document.getElementById('modal');
  const modalEnd=backdrop.classList.contains('open') ? modal.getBoundingClientRect().bottom+24 : 0;
  window.parent.postMessage({type:'ludica-appuntamenti-height',height:Math.ceil(Math.max(document.body.scrollHeight,modalEnd))}, '*');
}
if ('ResizeObserver' in window) new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load',reportHeight);
window.addEventListener('resize',reportHeight);
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const norm = v => String(v ?? '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(value) { try { const u = new URL(String(value || '').trim()); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } }
function field(row, key) { const match = Object.keys(row).find(k => norm(k.replace(/^\uFEFF/,'')) === key); return match ? String(row[match] ?? '').trim() : ''; }
function parseDate(raw) {
  const s = String(raw || '').trim();
  let m = /^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4})(?:\b|\s)/.exec(s);
  if (m) return validDate(+m[3], +m[2], +m[1]);
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:\b|\s)/.exec(s);
  return m ? validDate(+m[1], +m[2], +m[3]) : null;
}
function validDate(y,m,d) { const date = new Date(y,m-1,d); return date.getFullYear() === y && date.getMonth() === m-1 && date.getDate() === d ? date : null; }
function pretty(date) { return date ? `${date.getDate()} ${MONTHS[date.getMonth()]} ${date.getFullYear()}` : ''; }
function dates(item) {
  const a = item.start ? pretty(item.start) : item.startRaw;
  const b = item.end ? pretty(item.end) : item.endRaw;
  return b && b !== a ? `${a} – ${b}` : a || b || '';
}
function kind(url) { return /\.pdf(?:$|[?#])/i.test(url) ? 'pdf' : /\.(?:jpe?g|png|gif|webp|avif)(?:$|[?#])/i.test(url) ? 'image' : ''; }
function imageUrl(raw) {
  const u = safeUrl(raw); if (!u) return '';
  if (kind(u) === 'image') return u;
  const drive = /^https?:\/\/drive\.google\.com\/file\/d\/([\w-]+)/i.exec(u);
  return drive ? `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w1200` : '';
}
function face(label) { return `<div class="doc-face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6"/></svg><span>${esc(label)}</span></div>`; }
function showState(message, error=false) { state.textContent=message; state.className='state'+(error?' error':''); state.style.display='block'; }
async function loadData() {
  try {
    const response = await fetch(SHEET_URL, {cache:'no-store'});
    if (!response.ok) throw Error(`HTTP ${response.status}`);
    if (!window.Papa) throw Error('Libreria CSV non disponibile');
    const parsed = Papa.parse(await response.text(), {header:true,skipEmptyLines:'greedy'});
    const headers = (parsed.meta.fields || []).map(k=>norm(k.replace(/^\uFEFF/,'')));
    if (!FIELDS.every(k => headers.includes(k))) throw Error('Le intestazioni del foglio non corrispondono alle otto colonne previste.');
    const fresh = parsed.data.map(row => {
      const item = {title:field(row,'titolo'), description:field(row,'descrizione'), startRaw:field(row,'data inizio'), endRaw:field(row,'data fine'), place:field(row,'luogo'), poster:safeUrl(field(row,'url locandina')), pdf:safeUrl(field(row,'pdf locandina')), info:safeUrl(field(row,'url + info'))};
      item.start=parseDate(item.startRaw); item.end=parseDate(item.endRaw);
      item.image=imageUrl(item.poster);
      return item;
    }).filter(x=>x.title);
    items=fresh; state.style.display='none'; gallery.style.display='grid'; render();
    if (!fresh.length) showState('Non ci sono ancora appuntamenti pubblicati.');
  } catch (error) {
    console.error('Errore caricamento appuntamenti:',error);
    if (!items.length) { gallery.style.display='none'; showState('Non è stato possibile caricare gli appuntamenti. Riprova tra poco.', true); }
  }
}
function render() {
  const q=norm(document.getElementById('search').value);
  const matches=items.filter(x=>!q || [x.title,x.description,x.place,x.startRaw,x.endRaw].some(v=>norm(v).includes(q)));
  matches.sort((a,b)=>{
    const da=(a.start || a.end)?.getTime() ?? -Infinity;
    const db=(b.start || b.end)?.getTime() ?? -Infinity;
    return sortDir === 'desc' ? db-da : da-db;
  });
  const pageCount=Math.ceil(matches.length/PAGE_SIZE);
  currentPage=Math.max(1,Math.min(currentPage,pageCount || 1));
  gallery.innerHTML=matches.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE).map(x=>{
    const i=items.indexOf(x), image=x.image;
    const media=image ? `<img src="${esc(image)}" alt="" loading="lazy" onerror="this.parentElement.querySelector('.doc-face').style.display='flex';this.style.display='none'">${face('Locandina non disponibile')}` : face(x.pdf || x.poster ? 'Apri la locandina' : 'Appuntamento');
    const today=new Date(); today.setHours(0,0,0,0);
    const upcoming=(x.end || x.start) >= today;
    return `<button class="tile" data-id="${i}" type="button" aria-label="Dettagli: ${esc(x.title)}">${media}${upcoming ? '<span class="badge">In programma</span>':''}<div class="overlay">${dates(x)?`<div class="date">${esc(dates(x))}</div>`:''}<h3>${esc(x.title)}</h3>${x.description?`<div class="description">${esc(x.description)}</div>`:''}</div></button>`;
  }).join('');
  document.getElementById('count').textContent=`${matches.length} ${matches.length===1?'appuntamento':'appuntamenti'}`;
  const pagination=document.getElementById('pagination');
  pagination.replaceChildren();
  if (pageCount>1) {
    const addButton=(label,page,active=false)=>{
      const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.disabled=page<1||page>pageCount;
      if(active){btn.className='active';btn.setAttribute('aria-current','page');}
      btn.addEventListener('click',()=>{currentPage=page;render();document.getElementById('galleryStart').scrollIntoView({block:'start',behavior:'instant'});});
      pagination.append(btn);
    };
    addButton('‹ Precedente',currentPage-1);
    for(let page=1;page<=pageCount;page++) addButton(String(page),page,page===currentPage);
    addButton('Successiva ›',currentPage+1);
    pagination.setAttribute('aria-label',`Pagine degli appuntamenti: pagina ${currentPage} di ${pageCount}`);
  }
  if (!matches.length && items.length) { showState('Nessun appuntamento corrisponde alla ricerca.'); } else if (items.length) state.style.display='none';
  requestAnimationFrame(reportHeight);
}
function addLink(container,url,label) { if (!url) return; const a=document.createElement('a'); a.className='btn'; a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=label; container.append(a); }
async function showPdf(canvas,url,version) {
  if (!window.pdfjsLib) return;
  try {
    const pdf=await pdfjsLib.getDocument({url,withCredentials:false}).promise;
    const page=await pdf.getPage(1), viewport=page.getViewport({scale:1.3});
    if (version!==modalVersion || !backdrop.classList.contains('open')) return;
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  } catch (e) { console.warn('Anteprima PDF non disponibile:',e); if (version===modalVersion) canvas.replaceWith(Object.assign(document.createElement('div'),{textContent:'Apri la locandina PDF con il pulsante qui sotto.'})); }
}
function openModal(item, tile) {
  previousFocus=document.activeElement;
  const version=++modalVersion;
  document.getElementById('modalTitle').textContent=item.title;
  document.getElementById('modalDate').textContent=dates(item);
  document.getElementById('modalDescription').textContent=item.description;
  const meta=document.getElementById('modalMeta'); meta.replaceChildren();
  if (item.place) { const row=document.createElement('div'); row.className='meta-row'; const label=document.createElement('div');label.className='meta-label';label.textContent='Luogo';const value=document.createElement('div');value.textContent=item.place;row.append(label,value);meta.append(row); }
  const media=document.getElementById('modalMedia');media.replaceChildren();
  const actions=document.getElementById('modalActions');actions.replaceChildren();
  addLink(actions,item.info,'Maggiori informazioni');
  addLink(actions,item.poster,'Apri la locandina');
  if (item.pdf && item.pdf!==item.poster) addLink(actions,item.pdf,'Apri la locandina PDF');
  if (item.image) { const img=document.createElement('img');img.src=item.image;img.alt=`Locandina: ${item.title}`;img.onerror=()=>media.replaceChildren();media.append(img); }
  else if (item.pdf && kind(item.pdf)==='pdf') { const canvas=document.createElement('canvas'); canvas.setAttribute('aria-label','Anteprima locandina PDF'); media.append(canvas); showPdf(canvas,item.pdf,version); }
  document.getElementById('modal').style.marginTop=Math.max(20,tile.getBoundingClientRect().top-80)+'px';
  backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');document.getElementById('modalClose').focus();
  requestAnimationFrame(reportHeight);
}
function closeModal() { ++modalVersion;backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');previousFocus?.focus();requestAnimationFrame(reportHeight); }
gallery.addEventListener('click', e=>{const tile=e.target.closest('.tile'); if (tile) openModal(items[Number(tile.dataset.id)],tile);});
document.getElementById('search').addEventListener('input',()=>{currentPage=1;render();});
for (const dir of ['desc','asc']) document.getElementById(dir==='desc'?'sortDesc':'sortAsc').addEventListener('click',()=>{sortDir=dir;currentPage=1;document.getElementById('sortDesc').classList.toggle('active',dir==='desc');document.getElementById('sortAsc').classList.toggle('active',dir==='asc');render();});
document.getElementById('modalClose').addEventListener('click',closeModal);
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
document.addEventListener('keydown',e=>{if(!backdrop.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const controls=[...backdrop.querySelectorAll('button,a[href]')].filter(x=>x.getClientRects().length);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
loadData();setInterval(()=>{if(!document.hidden)loadData();},5*60*1000);

</script>
</body>
</html>
